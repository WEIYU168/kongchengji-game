        function chooseNextQinPhrase() {
            if (!qinState || qinState.locked) return;

            let choices = qinIdioms.calm.filter((phrase) => (
                phrase !== qinState.lastPhrase
                && !qinState.completedPhrases.includes(phrase)
            ));
            if (!choices.length) {
                choices = qinIdioms.calm.filter((phrase) => phrase !== qinState.lastPhrase);
            }
            const phrase = choices[Math.floor(Math.random() * choices.length)];
            qinState.targetPhrase = phrase;
            qinState.lastPhrase = phrase;
            qinState.targetIndex = 0;
            qinState.nextTargetIndex = 0;
            qinState.targetQueueSize = Math.min(qinState.laneCount, phrase.length, 3);
            qinState.targetLaneOrder = makeQinTargetLaneOrder(phrase.length);
            qinState.lastTargetSpawnAt = Date.now();
            updateQinHud();
            updateQinMessage(`接住「${phrase}」。`);
            trackQinTimeout(() => fillQinTargetQueue(), qinState.targetSpawnDelay);
        }

        function makeQinShuffledIndices(length) {
            const order = Array.from({ length }, (_, index) => index);

            for (let i = order.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [order[i], order[j]] = [order[j], order[i]];
            }

            if (length > 1 && order.every((value, index) => value === index)) {
                order.push(order.shift());
            }

            return order;
        }

        function makeQinTargetLaneOrder(length) {
            const lanes = Array.from({ length: qinState.laneCount }, (_, index) => index);
            const visibleLength = Math.min(length, qinState.targetQueueSize || length);
            let order = [];

            for (let attempt = 0; attempt < 12; attempt++) {
                order = [];

                while (order.length < length) {
                    const shuffled = makeQinShuffledIndices(lanes.length).map((index) => lanes[index]);
                    order.push(...shuffled);
                }

                order = order.slice(0, length);
                if (!isQinAscendingLaneOrder(order.slice(0, visibleLength))) {
                    return order;
                }
            }

            if (order.length > 1) {
                [order[0], order[1]] = [order[1], order[0]];
            }
            return order;
        }

        function isQinAscendingLaneOrder(order) {
            return order.length > 1 && order.every((lane, index) => (
                index === 0 || lane > order[index - 1]
            ));
        }

        function fillQinTargetQueue() {
            if (!qinState || qinState.locked || !qinState.track) return;

            const activeTargetCount = qinState.tiles.filter((tile) => tile.target).length;
            const now = Date.now();
            if (activeTargetCount >= qinState.targetQueueSize || now - qinState.lastTargetSpawnAt < qinState.targetSpawnDelay) return;

            const targetIndex = qinState.nextTargetIndex;
            const char = qinState.targetPhrase.charAt(targetIndex);
            if (!char) return;

            spawnQinTile({
                char,
                category: 'calm',
                target: true,
                targetIndex,
                lane: qinState.targetLaneOrder[targetIndex] ?? (targetIndex % qinState.laneCount)
            });
            qinState.nextTargetIndex += 1;
            qinState.lastTargetSpawnAt = now;
        }

        function spawnQinDecoy() {
            if (!qinState || qinState.locked || !qinState.track || qinState.tiles.length > 13) return;

            const phrase = qinIdioms.tense[Math.floor(Math.random() * qinIdioms.tense.length)];
            const char = phrase.charAt(Math.floor(Math.random() * phrase.length));
            const lane = getQinDecoyLane();
            if (lane === null) return;

            spawnQinTile({
                char,
                category: 'tense',
                target: false,
                lane
            });
        }

        function getQinDecoyLane() {
            if (!qinState) return null;

            const targetLanes = new Set(qinState.tiles.filter((tile) => tile.target).map((tile) => tile.lane));
            const lanes = Array.from({ length: qinState.laneCount }, (_, index) => index);
            const clearLanes = lanes.filter((lane) => (
                !targetLanes.has(lane)
                && !qinState.tiles.some((tile) => tile.lane === lane && tile.y < 150)
            ));
            const fallbackLanes = lanes.filter((lane) => !targetLanes.has(lane));
            const lanePool = clearLanes.length ? clearLanes : fallbackLanes;

            if (!lanePool.length) return null;
            return lanePool[Math.floor(Math.random() * lanePool.length)];
        }

        function clearQinDecoysFromLane(lane) {
            if (!qinState) return;

            qinState.tiles
                .filter((tile) => !tile.target && tile.lane === lane)
                .forEach((tile) => removeQinTile(tile));
        }

        function spawnQinTile(item) {
            if (!qinState || !qinState.track) return;

            const tileNode = document.createElement('button');
            const trackHeight = qinState.track.clientHeight || 360;
            if (item.target) {
                clearQinDecoysFromLane(item.lane);
            }
            const targetOffset = item.target ? (item.targetOffset ?? 0) : 0;
            const speed = Math.min(150, Math.max(78, trackHeight / 5.9 + qinState.completed * 4 + (item.target ? 0 : 8)));
            const tile = {
                id: qinState.nextTileId++,
                char: item.char,
                category: item.category,
                target: item.target,
                targetIndex: item.targetIndex ?? null,
                lane: item.lane,
                y: -78 - targetOffset,
                speed,
                node: tileNode
            };

            tileNode.className = `qin-tile is-${item.category}${item.target ? ' is-target' : ''}`;
            tileNode.type = 'button';
            tileNode.textContent = item.char;
            tileNode.setAttribute('aria-label', `${item.target ? '自在' : '緊張'}字 ${item.char}`);
            tileNode.style.left = `${((item.lane + 0.5) / qinState.laneCount) * 100}%`;
            tileNode.style.setProperty('--y', `${tile.y}px`);
            tileNode.addEventListener('click', () => handleQinTileHit(tile.id));

            qinState.tiles.push(tile);
            qinState.track.appendChild(tileNode);
            updateQinTileStates();
        }

        function animateQinTiles(timestamp) {
            if (!qinState || qinState.locked) return;

            if (!qinState.lastFrameAt) {
                qinState.lastFrameAt = timestamp;
            }
            const delta = Math.min(48, timestamp - qinState.lastFrameAt);
            qinState.lastFrameAt = timestamp;
            const trackHeight = qinState.track ? qinState.track.clientHeight : 360;

            qinState.tiles.slice().forEach((tile) => {
                if (!qinState.tiles.includes(tile)) return;

                tile.y += tile.speed * (delta / 1000);
                tile.node.style.setProperty('--y', `${tile.y}px`);

                if (tile.y > trackHeight + 126) {
                    removeQinTile(tile);
                    if (tile.target) {
                        qinState.nextTargetIndex = Math.min(qinState.nextTargetIndex, tile.targetIndex);
                        updateQinMessage(`「${tile.char}」落下了，穩住琴聲再補接。`);
                        trackQinTimeout(() => fillQinTargetQueue(), 220);
                    }
                }
            });

            qinAnimationFrame = requestAnimationFrame(animateQinTiles);
        }

        function handleQinTileHit(tileId) {
            if (!qinState || qinState.locked) return;

            const tile = qinState.tiles.find((item) => item.id === tileId);
            if (!tile) return;

            if (!tile.target) {
                removeQinTile(tile);
                registerQinMistake(`「${tile.char}」帶著緊張之氣，不可接。`);
                return;
            }

            const expectedChar = qinState.targetPhrase.charAt(qinState.targetIndex);
            if (tile.targetIndex !== qinState.targetIndex || tile.char !== expectedChar) {
                updateQinMessage(`先接「${expectedChar}」，照成語順序來。`);
                return;
            }

            collectQinTile(tile);
            playQinCorrectSparkSound(qinState.targetIndex);
            qinState.targetIndex += 1;
            updateQinHud();

            if (qinState.targetIndex >= qinState.targetPhrase.length) {
                const completedPhrase = qinState.targetPhrase;
                qinState.completedPhrases.push(completedPhrase);
                qinState.completed += 1;
                updateQinHud();
                updateQinMessage(`「${completedPhrase}」已成，琴聲更穩。`);

                if (qinState.completed >= qinState.targetScore) {
                    finishQinTilesGame(true, '城樓琴聲從容不亂，斥候再無破綻可尋。');
                    return;
                }

                trackQinTimeout(() => chooseNextQinPhrase(), 260);
                return;
            }

            updateQinMessage(`下一字：${qinState.targetPhrase.charAt(qinState.targetIndex)}`);
            trackQinTimeout(() => fillQinTargetQueue(), qinState.targetSpawnDelay);
        }

        function removeQinTile(tile) {
            if (!qinState) return;

            qinState.tiles = qinState.tiles.filter((item) => item.id !== tile.id);
            tile.node.remove();
        }

        function collectQinTile(tile) {
            if (!qinState) return;

            qinState.tiles = qinState.tiles.filter((item) => item.id !== tile.id);
            tile.node.disabled = true;
            tile.node.classList.add('is-caught');
            showQinSpark(tile);
            flashQinCatcher();
            setTimeout(() => tile.node.remove(), 120);
        }

        function showQinSpark(tile) {
            if (!qinState || !qinState.track) return;

            const spark = document.createElement('div');
            const tileSize = tile.node.offsetWidth || 58;
            spark.className = 'qin-spark';
            spark.style.left = tile.node.style.left;
            spark.style.top = `${Math.max(28, tile.y + tileSize / 2)}px`;
            qinState.track.appendChild(spark);
            setTimeout(() => spark.remove(), 520);
        }

        function flashQinCatcher() {
            const catcher = document.querySelector('.qin-catcher');
            if (!catcher) return;

            catcher.classList.remove('is-sparked');
            void catcher.offsetWidth;
            catcher.classList.add('is-sparked');
            setTimeout(() => catcher.classList.remove('is-sparked'), 260);
        }

        function registerQinMistake(message) {
            if (!qinState || qinState.locked) return;

            qinState.mistakes += 1;
            qinState.targetIndex = 0;
            qinState.nextTargetIndex = 0;
            qinState.tiles
                .filter((tile) => tile.target)
                .forEach((tile) => removeQinTile(tile));
            playQinMistakeSound();
            updateQinHud();
            updateQinMessage(message);

            if (qinState.mistakes >= qinState.maxMistakes) {
                finishQinTilesGame(false, '琴聲被緊張字打亂。');
                return;
            }

            trackQinTimeout(() => fillQinTargetQueue(), 260);
        }

        function updateQinHud() {
            if (!qinState) return;

            const score = document.getElementById('qin-score');
            const time = document.getElementById('qin-time');
            const mistakes = document.getElementById('qin-mistakes');
            const targetPhrase = document.getElementById('qin-target-phrase');
            const catcherHint = document.getElementById('qin-catcher-hint');

            if (score) score.textContent = `${qinState.completed}/${qinState.targetScore}`;
            if (time) time.textContent = qinState.timeLeft;
            if (mistakes) mistakes.textContent = `${qinState.mistakes}/${qinState.maxMistakes}`;
            if (targetPhrase) {
                targetPhrase.innerHTML = qinState.targetPhrase.split('').map((char, index) => {
                    const caughtClass = index < qinState.targetIndex ? ' is-caught' : '';
                    return `<span class="qin-target-char${caughtClass}">${escapeHtml(char)}</span>`;
                }).join('');
            }
            if (catcherHint) {
                const nextChar = qinState.targetPhrase.charAt(qinState.targetIndex);
                catcherHint.textContent = nextChar ? `點下一字：${nextChar}` : '準備下一句';
            }
            updateQinTileStates();
        }

        function updateQinTileStates() {
            if (!qinState) return;

            qinState.tiles.forEach((tile) => {
                tile.node.classList.toggle('is-next', tile.target && tile.targetIndex === qinState.targetIndex);
            });
        }

        function updateQinMessage(message) {
            const messageNode = document.getElementById('qin-message');
            if (messageNode) {
                messageNode.textContent = message;
            }
        }

        function finishQinTilesGame(success, message) {
            if (!qinState || qinState.locked) return;

            qinState.locked = true;
            qinState.tiles.forEach((tile) => {
                tile.node.disabled = true;
            });
            updateQinMessage(message);
            playQinCadence(success);

            qinTimers.forEach((timer) => {
                if (timer.type === 'interval') {
                    clearInterval(timer.id);
                } else {
                    clearTimeout(timer.id);
                }
            });
            qinTimers = [];
            if (qinAnimationFrame) {
                cancelAnimationFrame(qinAnimationFrame);
                qinAnimationFrame = null;
            }
            setTimeout(() => resumeGameMusicAfterQinGame(), 720);

            const nextScene = success ? qinState.successScene : qinState.failScene;
            if (success) {
                applyEffects(qinState.successEffects);
                showQinTilesSuccessDialog(nextScene, message);
                return;
            }

            trackQinTimeout(() => loadScene(nextScene), 850);
        }

        function showQinTilesSuccessDialog(nextScene, message) {
            const result = document.createElement('div');
            result.className = 'whack-result';

            const card = document.createElement('div');
            card.className = 'whack-result-card';

            const title = document.createElement('h2');
            title.textContent = '琴聲成句';

            const detail = document.createElement('p');
            detail.textContent = `${message} 按下確定後繼續劇情。`;

            const confirmButton = document.createElement('button');
            confirmButton.className = 'whack-confirm-btn';
            confirmButton.type = 'button';
            confirmButton.textContent = '確定';
            confirmButton.addEventListener('click', () => {
                playQinCatchSound(3);
                loadScene(nextScene);
            });

            card.appendChild(title);
            card.appendChild(detail);
            card.appendChild(confirmButton);
            result.appendChild(card);
            stageGameLayer.appendChild(result);
            try {
                confirmButton.focus({ preventScroll: true });
            } catch (error) {
                confirmButton.focus();
            }
        }

        function renderWhackGame(scene) {
            ensureTypingAudio();
            const config = {
                duration: 18,
                targetScore: 8,
                maxMistakes: 3,
                successScene: 'path_control',
                failScene: 'bad_end_whack',
                ...scene.whackGame
            };

            whackState = {
                score: 0,
                mistakes: 0,
                timeLeft: config.duration,
                targetScore: config.targetScore,
                maxMistakes: config.maxMistakes,
                successScene: config.successScene,
                failScene: config.failScene,
                activeItems: Array(9).fill(null),
                locked: false,
                holes: []
            };

            choicesContainer.innerHTML = '';
            stageGameLayer.innerHTML = '';
            stageGameLayer.classList.add('is-active');
            gameContainer.classList.add('is-whack-scene');

            const panel = document.createElement('div');
            panel.className = 'whack-panel';
            panel.innerHTML = `
                <div class="whack-status">
                    <div class="whack-stat">命中<strong id="whack-score">0/${config.targetScore}</strong></div>
                    <div class="whack-stat">時間<strong id="whack-time">${config.duration}</strong></div>
                    <div class="whack-stat">失誤<strong id="whack-mistakes">0/${config.maxMistakes}</strong></div>
                </div>
                <div class="whack-grid" aria-label="九洞打地鼠"></div>
                <div class="whack-message" id="whack-message">打中吵、狂；避開兵、掃。</div>
            `;

            const grid = panel.querySelector('.whack-grid');
            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('button');
                hole.className = 'whack-hole';
                hole.type = 'button';
                hole.setAttribute('aria-label', `第 ${i + 1} 洞`);
                hole.innerHTML = `
                    <span class="whack-piece">
                        <img class="whack-img is-missing" alt="">
                    </span>
                `;

                const img = hole.querySelector('.whack-img');
                img.addEventListener('load', () => img.classList.remove('is-missing'));
                img.addEventListener('error', () => img.classList.add('is-missing'));
                hole.addEventListener('click', () => handleWhackHit(i));
                whackState.holes.push(hole);
                grid.appendChild(hole);
            }

            stageGameLayer.appendChild(panel);
            updateWhackHud();

            trackWhackInterval(() => {
                if (!whackState || whackState.locked) return;
                whackState.timeLeft -= 1;
                updateWhackHud();
                if (whackState.timeLeft <= 0) {
                    finishWhackGame(false, '斥候已察覺街面騷動。');
                }
            }, 1000);

            scheduleWhackSpawn(250);
        }

        function scheduleWhackSpawn(delay = 620) {
            trackWhackTimeout(() => {
                if (!whackState || whackState.locked) return;
                spawnWhackItem();
                scheduleWhackSpawn(460 + Math.floor(Math.random() * 360));
            }, delay);
        }

        function spawnWhackItem() {
            const emptyHoles = whackState.activeItems
                .map((item, index) => item ? null : index)
                .filter((index) => index !== null);

            if (!emptyHoles.length) return;

            const targetItems = [
                { label: '吵', src: IMG('吵.png'), target: true },
                { label: '狂', src: IMG('狂.png'), target: true }
            ];
            const decoyItems = [
                { label: '兵', src: IMG('兵.png'), target: false },
                { label: '掃', src: IMG('掃.png'), target: false }
            ];
            const itemPool = Math.random() < 0.65 ? targetItems : decoyItems;
            const item = itemPool[Math.floor(Math.random() * itemPool.length)];
            const holeIndex = emptyHoles[Math.floor(Math.random() * emptyHoles.length)];

            whackState.activeItems[holeIndex] = item;
            setWhackHoleItem(holeIndex, item);
            playWhackSound('pop');

            trackWhackTimeout(() => {
                if (!whackState || whackState.locked) return;
                if (whackState.activeItems[holeIndex] === item) {
                    clearWhackHole(holeIndex);
                }
            }, 920);
        }

        function setWhackHoleItem(index, item) {
            const hole = whackState.holes[index];
            const img = hole.querySelector('.whack-img');

            img.classList.add('is-missing');
            img.src = item.src.replace(/^url\(['"]?/, '').replace(/['"]?\)$/, '');
            img.alt = item.label;
            hole.classList.add('active');
        }

        function clearWhackHole(index) {
            const hole = whackState.holes[index];
            const img = hole.querySelector('.whack-img');

            whackState.activeItems[index] = null;
            hole.classList.remove('active');
            img.removeAttribute('src');
            img.alt = '';
        }

        function handleWhackHit(index) {
            if (!whackState || whackState.locked) return;

            const item = whackState.activeItems[index];
            if (!item) return;

            const hole = whackState.holes[index];
            clearWhackHole(index);

            if (item.target) {
                whackState.score += 1;
                flashWhackHole(hole, 'hit');
                playWhackSound('hit');
                updateWhackMessage(`${item.label} 已壓下。`);
                if (whackState.score >= whackState.targetScore) {
                    finishWhackGame(true, '街面重歸寂靜。');
                }
            } else {
                whackState.mistakes += 1;
                flashWhackHole(hole, 'wrong');
                updateWhackMessage(`${item.label} 不可打。`);
                if (whackState.mistakes >= whackState.maxMistakes) {
                    finishWhackGame(false, '軍令失準，街面失控。');
                }
            }

            updateWhackHud();
        }

        function flashWhackHole(hole, className) {
            hole.classList.add(className);
            trackWhackTimeout(() => hole.classList.remove(className), 220);
        }

        function updateWhackHud() {
            const score = document.getElementById('whack-score');
            const time = document.getElementById('whack-time');
            const mistakes = document.getElementById('whack-mistakes');
            if (!score || !time || !mistakes || !whackState) return;

            score.textContent = `${whackState.score}/${whackState.targetScore}`;
            time.textContent = whackState.timeLeft;
            mistakes.textContent = `${whackState.mistakes}/${whackState.maxMistakes}`;
        }

        function updateWhackMessage(message) {
            const messageNode = document.getElementById('whack-message');
            if (messageNode) {
                messageNode.textContent = message;
            }
        }

        function finishWhackGame(success, message) {
            if (!whackState || whackState.locked) return;

            whackState.locked = true;
            whackState.holes.forEach((hole) => {
                hole.disabled = true;
                hole.classList.remove('active');
            });
            updateWhackMessage(message);

            const nextScene = success ? whackState.successScene : whackState.failScene;
            playWhackSound(success ? 'success' : 'fail');
            whackTimers.forEach((timer) => {
                if (timer.type === 'interval') {
                    clearInterval(timer.id);
                } else {
                    clearTimeout(timer.id);
                }
            });
            whackTimers = [];
            if (success) {
                showWhackSuccessDialog(nextScene, message);
                return;
            }

            trackWhackTimeout(() => loadScene(nextScene), 700);
        }

        function showWhackSuccessDialog(nextScene, message) {
            const result = document.createElement('div');
            result.className = 'whack-result';

            const card = document.createElement('div');
            card.className = 'whack-result-card';

            const title = document.createElement('h2');
            title.textContent = '恭喜過關';

            const detail = document.createElement('p');
            detail.textContent = `${message} 按下確定後繼續劇情。`;

            const confirmButton = document.createElement('button');
            confirmButton.className = 'whack-confirm-btn';
            confirmButton.type = 'button';
            confirmButton.textContent = '確定';
            confirmButton.addEventListener('click', () => {
                playWhackSound('hit');
                loadScene(nextScene);
            });

            card.appendChild(title);
            card.appendChild(detail);
            card.appendChild(confirmButton);
            result.appendChild(card);
            stageGameLayer.appendChild(result);
            try {
                confirmButton.focus({ preventScroll: true });
            } catch (error) {
                confirmButton.focus();
            }
        }

        function renderChoices(scene) {
            choicesContainer.innerHTML = '';
            if (isFailureScene(scene) && canRewind()) {
                const rewindBtn = document.createElement('button');
                rewindBtn.className = 'choice-btn is-rewind';
                rewindBtn.type = 'button';
                rewindBtn.innerHTML = '時光倒流<small>僅此一次，回到上一個選擇機會</small>';
                rewindBtn.onclick = rewindToPreviousChoice;
                choicesContainer.appendChild(rewindBtn);
            }
            scene.choices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.type = 'button';
                btn.innerHTML = `${choice.text}${choice.note ? `<small>${choice.note}</small>` : ''}`;
                btn.onclick = () => {
                    recordChoiceCheckpoint();
                    applyEffects(choice.effects);
                    loadScene(choice.nextScene);
                };
                choicesContainer.appendChild(btn);
            });
        }

        function recordChoiceCheckpoint() {
            const scene = getScene(currentSceneId);
            if (!scene || scene.ending) return;

            choiceHistory.push({
                sceneId: currentSceneId,
                stats: { ...stats },
                musicTime: gameMusic.currentTime || 0
            });
            if (choiceHistory.length > 12) {
                choiceHistory = choiceHistory.slice(-12);
            }
            saveGame();
        }

        function isFailureScene(scene) {
            return Boolean(scene && scene.ending && (
                scene.chapter === '敗局'
                || scene.chapter === '失敗結局'
                || scene.speaker === '遊戲失敗'
                || scene.speaker === '琴聲失序'
                || String(scene.speaker || '').startsWith('敗局')
            ));
        }

        function canRewind() {
            return !rewindUsed && choiceHistory.length > 0;
        }

        function rewindToPreviousChoice() {
            if (!canRewind()) return;

            const checkpoint = choiceHistory.pop();
            rewindUsed = true;
            stats = { ...initialStats, ...checkpoint.stats };
            shouldResumeMusicAfterQin = false;
            gameMusic.currentTime = checkpoint.musicTime || 0;
            startGameMusic(false);
            loadScene(checkpoint.sceneId);
        }

        function typeWriterEffect(text, callback, withSound = false) {
            let i = 0;
            dialogueText.classList.add('cursor');

            typeWriterInterval = setInterval(() => {
                if (i >= text.length) {
                    finishTyping(callback);
                    return;
                }

                const char = text.charAt(i);
                dialogueText.innerHTML += char === '\n' ? '<br>' : escapeHtml(char);
                if (withSound && char.trim()) {
                    playTypingSound();
                }
                i++;
            }, 24);
        }

        function finishTyping(callback) {
            clearInterval(typeWriterInterval);
            dialogueText.classList.remove('cursor');
            typingDone = true;
            document.getElementById('dialogue-box').scrollTop = document.getElementById('dialogue-box').scrollHeight;
            if (callback) callback();
        }

        function escapeHtml(char) {
            const span = document.createElement('span');
            span.textContent = char;
            return span.innerHTML;
        }

        dialogueText.addEventListener('click', () => {
            if (typingDone) return;
            const scene = getScene(currentSceneId);
            clearInterval(typeWriterInterval);
            dialogueText.innerHTML = activeText.split('\n').map((line) => {
                const span = document.createElement('span');
                span.textContent = line;
                return span.innerHTML;
            }).join('<br>');
            finishTyping(() => renderSceneAction(scene));
        });

        function showTitleScreen() {
            openingVideo.pause();
            openingVideoScreen.classList.remove('is-active');
            playOpeningBtn.classList.remove('is-visible');
            titleScreen.classList.remove('hide');
            openingRestartBtn.classList.remove('is-visible');
            restartTitleAnimation();
        }

        function restartTitleAnimation() {
            const animatedNodes = titleScreen.querySelectorAll('.generated-title-image, .title-mark, .title-subtitle, .title-credit, #start-game-btn');
            animatedNodes.forEach((node) => {
                node.style.animation = 'none';
                void node.offsetWidth;
                node.style.animation = '';
            });
        }

        function returnToTitleScreen() {
            gameHasBegun = false;
            clearInterval(typeWriterInterval);
            clearCharacterTimeouts();
            clearTimeout(associationTimeout);
            clearWhackGame();
            clearQinTilesGame();
            clearRoutePlanGame();
            stopGameMusic();
            localStorage.removeItem(STORAGE_KEY);
            currentSceneId = 'start';
            stats = { ...initialStats };
            choiceHistory = [];
            rewindUsed = false;
            updateStats();
            gameContainer.classList.add('is-hidden');
            openingVideoScreen.classList.remove('is-active');
            playOpeningBtn.classList.remove('is-visible');
            openingRestartBtn.classList.remove('is-visible');
            titleScreen.classList.remove('hide');
            restartTitleAnimation();
        }

        function beginGame() {
            if (gameHasBegun) return;
            gameHasBegun = true;
            openingVideo.pause();
            openingVideoScreen.classList.remove('is-active');
            playOpeningBtn.classList.remove('is-visible');
            titleScreen.classList.add('hide');
            gameContainer.classList.remove('is-hidden');
            startGameMusic(true);
            localStorage.removeItem(STORAGE_KEY);
            currentSceneId = 'start';
            stats = { ...initialStats };
            choiceHistory = [];
            rewindUsed = false;
            loadScene('start');
        }

        function returnToOpeningVideo() {
            gameHasBegun = false;
            clearInterval(typeWriterInterval);
            clearCharacterTimeouts();
            clearTimeout(associationTimeout);
            clearWhackGame();
            clearQinTilesGame();
            clearRoutePlanGame();
            stopGameMusic();
            localStorage.removeItem(STORAGE_KEY);
            currentSceneId = 'start';
            stats = { ...initialStats };
            choiceHistory = [];
            rewindUsed = false;
            updateStats();
            gameContainer.classList.add('is-hidden');
            titleScreen.classList.add('hide');
            openingRestartBtn.classList.remove('is-visible');
            openingVideoScreen.classList.add('is-active');
            playOpeningBtn.classList.remove('is-visible');
            openingVideo.currentTime = 0;
            openingVideo.muted = false;
            const playOpening = openingVideo.play();
            if (playOpening) {
                playOpening.catch(() => playOpeningBtn.classList.add('is-visible'));
            }
        }

        restartBtn.addEventListener('click', resetGame);
        openingRestartBtn.addEventListener('click', returnToOpeningVideo);
        startGameBtn.addEventListener('click', () => {
            ensureTypingAudio();
            beginGame();
        });
        openingVideo.addEventListener('ended', showTitleScreen);
        playOpeningBtn.addEventListener('click', () => {
            openingVideo.muted = false;
            playOpeningBtn.classList.remove('is-visible');
            const playOpening = openingVideo.play();
            if (playOpening) {
                playOpening.catch(() => playOpeningBtn.classList.add('is-visible'));
            }
        });
        skipOpeningBtn.addEventListener('click', showTitleScreen);

        window.addEventListener('DOMContentLoaded', () => {
            updateStats();
            openingVideo.currentTime = 0;
            openingVideo.muted = false;
            const playOpening = openingVideo.play();
            if (playOpening) {
                playOpening.catch(() => playOpeningBtn.classList.add('is-visible'));
            }
        });
    </script>
</body>
</html>
